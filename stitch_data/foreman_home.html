<script>
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('clock-btn');
    const progress = document.getElementById('clock-progress');
    const statusText = document.getElementById('clock-status-text');
    const btnText = document.getElementById('clock-text');
    const btnIcon = document.getElementById('clock-icon');

    let holdTimer;
    let isClockedIn = false;
    let isTransitioning = false;

    const startHold = (e) => {
      if (isTransitioning) return;
      
      progress.style.transition = "none";
      progress.style.width = "0%";
      void progress.offsetWidth;

      btnText.textContent = isClockedIn ? "Keep holding to Clock Out" : "Keep holding...";
      progress.style.transition = "width 2s linear";
      progress.style.width = "100%";

      holdTimer = setTimeout(() => {
        if (isClockedIn) {
          completeClockOut();
        } else {
          completeClockIn();
        }
      }, 2000);
    };

    const cancelHold = () => {
      if (isTransitioning) return;
      clearTimeout(holdTimer);
      btnText.textContent = isClockedIn ? "Clock Out" : "Clock In";
      progress.style.transition = "none";
      progress.style.width = "0%";
    };

    const completeClockIn = () => {
      isTransitioning = true;
      isClockedIn = true;
      if (navigator.vibrate) navigator.vibrate(200);
      
      btnText.textContent = "Clocked In";
      btnIcon.textContent = "check_circle";
      progress.style.transition = "none";
      progress.style.width = "0%";

      setTimeout(() => {
        btn.classList.remove('bg-primary');
        btn.classList.add('bg-error');
        btnText.textContent = "Clock Out";
        btnIcon.textContent = "logout";
        isTransitioning = false;
      }, 1000);
    };

    const completeClockOut = () => {
      isTransitioning = true;
      isClockedIn = false;
      if (navigator.vibrate) navigator.vibrate(200);
      
      btnText.textContent = "Clocked Out";
      btnIcon.textContent = "check_circle";
      progress.style.transition = "none";
      progress.style.width = "0%";

      setTimeout(() => {
        btn.classList.remove('bg-error');
        btn.classList.add('bg-primary');
        btnText.textContent = "Clock In";
        btnIcon.textContent = "schedule";
        isTransitioning = false;
      }, 1000);
    };

    btn.addEventListener('touchstart', (e) => { e.preventDefault(); startHold(); });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); cancelHold(); });
    btn.addEventListener('mousedown', startHold);
    btn.addEventListener('mouseup', cancelHold);
    btn.addEventListener('mouseleave', cancelHold);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });
</script></body></html>
